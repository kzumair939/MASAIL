services:
  postgres:
    image: postgres:16-alpine
    container_name: masail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masail
      POSTGRES_USER: masail
      POSTGRES_PASSWORD: masail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masail -d masail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - masail-net

  redis:
    image: redis:7-alpine
    container_name: masail-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - masail-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masail-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/masail
      DB_USERNAME: masail
      DB_PASSWORD: masail
      DB_POOL_SIZE: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production-min-32-chars}
      JWT_EXPIRATION_MS: 86400000
      FRONTEND_ORIGIN: http://localhost:5173
      DDL_AUTO: update
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - masail-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: masail-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - masail-net

volumes:
  postgres_data:
  redis_data:

networks:
  masail-net:
    driver: bridge
