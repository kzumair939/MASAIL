# Local dev convenience overrides — H2 in-memory, no Redis required to boot the app,
# but caching will simply no-op gracefully if Redis isn't running when this profile is used.
spring:
  datasource:
    url: jdbc:h2:mem:masail;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
